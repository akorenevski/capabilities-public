# Profile "telegram-claude-restricted": a telegram bot turn on claude for a
# sender who is not a supervisor.
#
# Every restricted turn runs on it (or on a room's `restricted_profile`, held to
# the same allowlist), whatever harness serves supervisors: codex has no
# restricted profile, because its read-only sandbox reads the whole disk.
#
# Enforced by Claude Code, not by instruction: the turn has the file tools that
# read (Read, Grep, Glob) and no other built-in tool, so no shell, no web, no
# writes and no subagents; no MCP server is loaded. In the `default` permission
# mode a read outside the working directory (the project) asks for permission,
# and a headless turn cannot be asked, so it is refused; a link in the project
# that points outside is refused the same way. The project's own settings load
# (CLAUDE.md, rules), and an allow rule or extra directory in them would widen
# that, so the deny rules below - and the daemon's, added per turn for the bot's
# state folder and every folder beside the project and above it - outrank them:
# in Claude Code a deny beats any allow. `.env`-style files are denied inside
# the project too, since a project keeps its store credentials there, and so is
# `.git/config`, which can hold a remote's token. The user's settings do not
# load, hooks are off, memory is off, and git status (the user's name, the
# recent commits) stays out of the turn's context.
#
# What it does not hold: anything readable inside the project is readable, and
# whatever the turn reads it may say in its answer.

harness = "claude"
model = "opus"
permission_mode = "default"
tools = ["Read", "Grep", "Glob"]
setting_sources = ["project", "local"]
strict_mcp = true
mcp_config = { mcpServers = {} }
timeout_seconds = 86400

[settings]
disableAllHooks = true
autoMemoryEnabled = false
includeGitInstructions = false

[settings.permissions]
deny = ["Read(**/.env)", "Read(**/.env.*)", "Read(**/.envrc)", "Read(**/*.env)",
        "Read(**/.git/config)",
        "Read(~/.config/**)", "Read(~/.ssh/**)", "Read(~/.local/state/**)",
        "Read(//proc/**)"]
